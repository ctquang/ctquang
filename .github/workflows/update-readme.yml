name: Update README

on:
  schedule:
    - cron: "0 0 * * *" # 07:00 giờ Việt Nam mỗi ngày
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - template.md
      - templates/**
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats and render README
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LOGIN="${GITHUB_REPOSITORY_OWNER}"
          DATA=$(gh api graphql -f login="$LOGIN" -f query='
            query($login: String!) {
              user(login: $login) {
                contributionsCollection { totalCommitContributions }
                repositories(first: 100, ownerAffiliations: OWNER, isFork: false) {
                  nodes { stargazerCount }
                }
              }
            }')
          COMMITS=$(echo "$DATA" | jq '.data.user.contributionsCollection.totalCommitContributions // 0')
          STARS=$(echo "$DATA" | jq '[.data.user.repositories.nodes[].stargazerCount] | add // 0')
          echo "Commits: $COMMITS | Stars: $STARS"
          for f in template.md templates/*.svg; do
            case "$f" in
              template.md) out=README.md ;;
              *) out="assets/$(basename "$f")" ;;
            esac
            sed -e "s/{{COMMITS}}/$COMMITS/g" -e "s/{{STARS}}/$STARS/g" "$f" > "$out"
          done

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets/info-*.svg
          git diff --cached --quiet || (git commit -m "chore: update profile stats" && git push)
