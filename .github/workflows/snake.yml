name: Generate snake

on:
  schedule:
    - cron: "30 0 * * *" # 07:30 giờ Việt Nam mỗi ngày
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#5B93E5&color_dots=#ebedf0,#c6d8f5,#97b8ec,#5b93e5,#312284
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#A2BAE6&color_dots=#161b22,#1f3260,#2f4f9a,#5b93e5,#a2bae6

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
